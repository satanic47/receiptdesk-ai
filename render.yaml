services:
  - type: web
    name: receiptdesk-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMMA_INFERENCE_MODE
        value: local_fallback
      - key: STORAGE_BACKEND
        value: sqlite
      - key: TIGER_DATA_PG_URL
        sync: false
